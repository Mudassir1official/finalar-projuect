<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>

<a-scene
mindar-image="imageTargetSrc: logo.mind;"
color-space="sRGB"
renderer="colorManagement: true, physicallyCorrectLights"
vr-mode-ui="enabled: false"
device-orientation-permission-ui="enabled: false">

<a-assets>

<img id="card" src="test.png" />

<video
id="promoVideo"
src="dethnote.mp4"
autoplay
loop
muted
playsinline
webkit-playsinline>
</video>

<img id="instagramIcon" src="instagram.png">
<img id="whatsappicon" src="whatsapp.png">
<img id="youtubeicon" src="youtube.png">

</a-assets>

<a-camera
position="0 0 0"
look-controls="enabled: false">
</a-camera>

<a-entity mindar-image-target="targetIndex: 0">

<a-video
src="#promoVideo"
position="0 0.5 0"
width="1"
height="0.552"
rotation="60 0 0">
</a-video>

<a-plane
src="#card"
position="0 0 0"
height="0.552"
width="1">
</a-plane>

<a-image
src="#instagramIcon"
position="0 -0.5 0"
width="0.2"
height="0.2"
id="instaButton">
</a-image>

<a-image
src="#whatsappicon"
position="-0.3 -0.5 0"
width="0.2"
height="0.2"
id="whatsappButton">
</a-image>

<a-image
src="#youtubeicon"
position="0.3 -0.5 0"
width="0.2"
height="0.2"
id="youtubeButton">
</a-image>

</a-entity>

</a-scene>

<script>

document
.querySelector("#instaButton")
.addEventListener("click", function () {

window.open(
"https://instagram.com/",
"_blank"
);

});

</script>

</body>
</html>
