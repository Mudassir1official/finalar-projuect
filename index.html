<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>AR Experience</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    a-scene { position: fixed; inset: 0; }
  </style>
</head>
<body>

<a-scene
  mindar-image="imageTargetSrc: logo.mind; autoStart: true; uiLoading: no; uiScanning: no; uiError: no;"
  color-space="sRGB"
  renderer="colorManagement: true; physicallyCorrectLights: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  embedded>

  <a-assets>
    <img   id="card"          src="test.png" />
    <video id="promoVideo"    src="dethnote.mp4" autoplay muted loop playsinline preload="auto"></video>
    <img   id="instagramIcon" src="instagram.png" />
    <img   id="whatsappIcon"  src="whatsapp.png" />
    <img   id="youtubeIcon"   src="youtube.png" />
  </a-assets>

  <!-- Camera — no cursor component needed, we handle clicks ourselves -->
  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity mindar-image-target="targetIndex: 0" id="tracked-target">

    <a-plane
      src="#card"
      position="0 0 0"
      width="1"
      height="0.552">
    </a-plane>

    <a-video
      src="#promoVideo"
      position="0 0.55 0"
      width="1"
      height="0.552">
    </a-video>

    <!-- Each icon has:
         - class="clickable"  so our raycaster loop finds them
         - data-url           the link to open                  -->

    <a-image
      id="instaButton"
      class="clickable"
      src="#instagramIcon"
      position="0 -0.35 0.001"
      width="0.2" height="0.2"
      data-url="https://www.instagram.com/">
    </a-image>

    <a-image
      id="whatsappButton"
      class="clickable"
      src="#whatsappIcon"
      position="-0.3 -0.35 0.001"
      width="0.2" height="0.2"
      data-url="https://wa.me/YOUR_NUMBER">
    </a-image>

    <a-image
      id="youtubeButton"
      class="clickable"
      src="#youtubeIcon"
      position="0.3 -0.35 0.001"
      width="0.2" height="0.2"
      data-url="https://www.youtube.com/">
    </a-image>

  </a-entity>

</a-scene>

<script>
  /*
   * =============================================================
   * BULLETPROOF CLICK SYSTEM
   * =============================================================
   * We bypass A-Frame's cursor entirely.
   * Instead we:
   *   1. Listen for touchend / mouseup on the canvas directly
   *   2. Convert the tap position to normalised device coords (-1 to +1)
   *   3. Cast a THREE.js Raycaster ourselves from the camera
   *   4. Check if it hits any .clickable entity's mesh
   *   5. If yes → open the data-url
   * This works 100% on mobile because we own the event, not A-Frame.
   * =============================================================
   */

  const sceneEl  = document.querySelector('a-scene');
  const targetEl = document.getElementById('tracked-target');
  let   isTracking = false;

  targetEl.addEventListener('targetFound', () => { isTracking = true;  });
  targetEl.addEventListener('targetLost',  () => { isTracking = false; });

  sceneEl.addEventListener('loaded', () => {

    const renderer  = sceneEl.renderer;
    const camera    = sceneEl.camera;          // THREE.Camera
    const canvas    = sceneEl.canvas;

    // Build a THREE.Raycaster once, reuse on every tap
    const raycaster = new THREE.Raycaster();
    const pointer   = new THREE.Vector2();

    /*
     * getClickables()
     * Collect the Three.js Object3D meshes from every .clickable a-entity.
     * Called fresh on each tap so newly added entities are always included.
     */
    function getClickables() {
      const meshes = [];
      document.querySelectorAll('.clickable').forEach((el) => {
        if (el.object3D) {
          el.object3D.traverse((node) => {
            if (node.isMesh) meshes.push(node);
          });
        }
      });
      return meshes;
    }

    /*
     * handleTap(x, y)
     * x, y — pixel coordinates of the tap on the canvas
     */
    function handleTap(x, y) {
      if (!isTracking) return;   // marker must be visible

      const rect = canvas.getBoundingClientRect();

      // Convert pixel coords → NDC (-1 to +1)
      pointer.x =  ((x - rect.left) / rect.width)  * 2 - 1;
      pointer.y = -((y - rect.top)  / rect.height) * 2 + 1;

      raycaster.setFromCamera(pointer, camera);

      const meshes = getClickables();
      const hits   = raycaster.intersectObjects(meshes, true);

      if (hits.length === 0) return;

      // Walk up from the hit mesh to find the a-entity with data-url
      let obj = hits[0].object;
      while (obj) {
        if (obj.el && obj.el.dataset.url) {
          const url = obj.el.dataset.url;
          console.log('[AR] Opening:', url);
          window.open(url, '_blank', 'noopener,noreferrer');
          return;
        }
        obj = obj.parent;
      }
    }

    // ── TOUCH (mobile) ──────────────────────────────────────────
    canvas.addEventListener('touchend', (e) => {
      e.preventDefault();
      const touch = e.changedTouches[0];
      handleTap(touch.clientX, touch.clientY);
    }, { passive: false });

    // ── MOUSE (desktop) ─────────────────────────────────────────
    canvas.addEventListener('mouseup', (e) => {
      handleTap(e.clientX, e.clientY);
    });

    // Prevent scroll/zoom hijacking the canvas on mobile
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
    }, { passive: false });

  }); // end scene loaded
  console.log('[AR] Scene loaded, waiting for marker...');
</script>

</body>
</html>
